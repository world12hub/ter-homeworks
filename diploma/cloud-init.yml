#cloud-config
users:
  - name: ${username}
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}
package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - nginx
  - fail2ban

write_files:
  # HTML-страница для Nginx
  - path: /var/www/html/index.html
    owner: root:root
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="ru">
      <head>
        <meta charset="UTF-8">
        <title>Дипломный проект</title>
        <style>
          body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
          h1 { color: #2c3e50; }
          pre { background: #fff; padding: 20px; border-radius: 8px; display: inline-block; text-align: left; }
        </style>
      </head>
      <body>
        <h1>Дипломный проект</h1>
        <h2>Студент: Канюгин Сергей Борисович</h2>
        <h3>Репозиторий: https://github.com/world12hub/ter-homeworks/tree/main/diploma</h3>
        <p>Данные из БД:</p>
        <pre id="output">Загрузка...</pre>
        <script>
          fetch('/api/')
            .then(r => r.json())
            .then(data => document.getElementById('output').textContent = JSON.stringify(data, null, 2))
            .catch(err => document.getElementById('output').textContent = 'Ошибка: ' + err);
        </script>
      </body>
      </html>

  # Конфиг Nginx: статика + прокси на приложение
  - path: /etc/nginx/sites-available/default
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          server_name _;

          root /var/www/html;
          index index.html;

          location /api/ {
              proxy_pass http://127.0.0.1:5000/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }

          location / {
              try_files $uri $uri/ =404;
          }
      }

  # Настройка fail2ban для SSH
  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 5
      bantime = 600
      findtime = 600


runcmd:
  # --- Docker ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # --- Запуск сервисов ---
  - systemctl enable --now docker
  - systemctl enable --now nginx
  - systemctl enable --now fail2ban

  # --- Добавить пользователя в группу docker (ПОСЛЕ установки) ---
  - usermod -aG docker ${username}

  # --- Создать папку для приложения ---
  - mkdir -p /home/${username}/app
  - chown -R ${username}:${username} /home/${username}/app

  # --- Финальный сигнал ---
  - echo "Cloud-init завершён $(date)" > /var/log/cloud-init-done.log
