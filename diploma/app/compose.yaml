services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: cr.yandex/<registry_id>/app:latest
    container_name: web-app
    restart: always
    ports:
      - "80:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
